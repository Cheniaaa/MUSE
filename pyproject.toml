[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muse"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.13.5", "annotated-types==0.8.0", "jsonschema==4.26.0", "PyYAML==6.0.3",
    "mjlab==1.6.0", "rsl-rl-lib==5.4.2", "torch==2.11.0+cu128",
    "mujoco==3.11.0", "mujoco-warp==3.11.0", "warp-lang==1.16.0",
    "viser==1.1.1", "mjviser==0.0.14", "fastapi==0.141.1", "uvicorn==0.53.0",
    # 保留已验证环境的传递依赖，不因HTTP接入升级GPU/显示工具链。
    "contourpy==1.3.3", "cuda-bindings==12.9.7", "cuda-pathfinder==1.6.0",
    "filelock==3.32.3", "fonttools==4.63.0", "fsspec==2026.7.0", "idna==3.19",
    "matplotlib==3.11.1", "networkx==3.6.1", "numpy==2.5.2", "onnx==1.22.0",
    "platformdirs==4.11.8", "protobuf==7.36.1", "pyparsing==3.3.2",
    "setuptools==78.1.0", "trimesh==5.0.0", "urllib3==2.7.0", "wandb==0.28.0",
    "wcwidth==0.8.3",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "httpx2==2.13.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
muse_builtins = ["assets/bitcraze_crazyflie_2/*", "assets/bitcraze_crazyflie_2/assets/*", "assets/ugv_diff_drive/*", "assets/radio_base_station/*"]

[tool.setuptools.data-files]
"share/muse" = ["examples/basic_flight/controller.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.pip]
torch-backend = "cu128"

[tool.muse.platform]
python = "3.12.3"
mjlab = "1.6.0"
rsl-rl-lib = "5.4.2"
torch = "2.11.0+cu128"
mujoco = "3.11.0"
mujoco-warp = "3.11.0"
warp-lang = "1.16.0"

algorithm: builtin:mappo
algorithm_config:
  collection_steps: 32
  hidden_dims: [64, 64]
  learning_rate: 0.0003
  num_learning_epochs: 4
  num_mini_batches: 4
  gamma: 0.99
  lam: 0.95
  clip_param: 0.2
  value_loss_coef: 1
  entropy_coef: 0.01
  max_grad_norm: 1
  share_actor_parameters: true
  recurrent: null
task: isac_task
task_config:
  horizon_decisions: 500
  workspace_by_role:
    alpha: {minimum_m: [-2, -2, 0.5], maximum_m: [2.5, 3, 1.5]}
    beta: {minimum_m: [5.5, -2, 0.5], maximum_m: [10, 3, 1.5]}
  service_bits_scale: 5000000
  rf_energy_scale_j: 0.00008
  rf_penalty_weight: 1
  position_bound_limit_m: 0.01
model_bindings:
  radio: builtin:free_space_radio
  sensing: builtin:free_space_path_length_efim_2d
agent_roles:
  alpha:
    entity_kind: aerial_vehicle
    action_interfaces: {motion: body_velocity, radio: power_channel}
    observation_terms:
      - {selection_id: target, term: 'builtin:relative_target', required: true}
      - {selection_id: velocity, term: 'builtin:velocity_world', required: true}
      - {selection_id: orientation, term: 'builtin:orientation_wxyz', required: true}
      - {selection_id: angular_velocity, term: 'builtin:angular_velocity_body', required: true}
      - {selection_id: previous_action, term: 'builtin:previous_action', required: true}
      - {selection_id: remaining, term: remaining_time, required: true}
      - {selection_id: feedback, term: 'builtin:selected_link_feedback', required: true, config: {link_id: alpha_up, rate_scale_bps: 100000000, power_scale_w: 0.001}}
      - {selection_id: measurement, term: 'builtin:local_path_length', required: true, config: {sensing_id: alpha_probe, range_scale_m: 100}}
    reward_terms:
      - {selection_id: team, term: team_reward, default_enabled: false, weight: 1}
  beta:
    entity_kind: aerial_vehicle
    action_interfaces: {motion: body_velocity, radio: power_channel}
    observation_terms:
      - {selection_id: target, term: 'builtin:relative_target', required: true}
      - {selection_id: velocity, term: 'builtin:velocity_world', required: true}
      - {selection_id: orientation, term: 'builtin:orientation_wxyz', required: true}
      - {selection_id: angular_velocity, term: 'builtin:angular_velocity_body', required: true}
      - {selection_id: previous_action, term: 'builtin:previous_action', required: true}
      - {selection_id: remaining, term: remaining_time, required: true}
      - {selection_id: feedback, term: 'builtin:selected_link_feedback', required: true, config: {link_id: beta_up, rate_scale_bps: 100000000, power_scale_w: 0.001}}
      - {selection_id: measurement, term: 'builtin:local_path_length', required: true, config: {sensing_id: beta_probe, range_scale_m: 100}}
    reward_terms:
      - {selection_id: team, term: team_reward, default_enabled: false, weight: 1}
critic_inputs:
  team:
    observation_terms:
      - {selection_id: alpha_target, term: 'builtin:relative_target', role_id: alpha, required: true}
      - {selection_id: alpha_velocity, term: 'builtin:velocity_world', role_id: alpha, required: true}
      - {selection_id: alpha_orientation, term: 'builtin:orientation_wxyz', role_id: alpha, required: true}
      - {selection_id: alpha_angular_velocity, term: 'builtin:angular_velocity_body', role_id: alpha, required: true}
      - {selection_id: alpha_previous_action, term: 'builtin:previous_action', role_id: alpha, required: true}
      - {selection_id: alpha_remaining, term: remaining_time, role_id: alpha, required: true}
      - {selection_id: alpha_feedback, term: 'builtin:selected_link_feedback', role_id: alpha, required: true, config: {link_id: alpha_up, rate_scale_bps: 100000000, power_scale_w: 0.001}}
      - {selection_id: alpha_measurement, term: 'builtin:local_path_length', role_id: alpha, required: true, config: {sensing_id: alpha_probe, range_scale_m: 100}}
      - {selection_id: beta_target, term: 'builtin:relative_target', role_id: beta, required: true}
      - {selection_id: beta_velocity, term: 'builtin:velocity_world', role_id: beta, required: true}
      - {selection_id: beta_orientation, term: 'builtin:orientation_wxyz', role_id: beta, required: true}
      - {selection_id: beta_angular_velocity, term: 'builtin:angular_velocity_body', role_id: beta, required: true}
      - {selection_id: beta_previous_action, term: 'builtin:previous_action', role_id: beta, required: true}
      - {selection_id: beta_remaining, term: remaining_time, role_id: beta, required: true}
      - {selection_id: beta_feedback, term: 'builtin:selected_link_feedback', role_id: beta, required: true, config: {link_id: beta_up, rate_scale_bps: 100000000, power_scale_w: 0.001}}
      - {selection_id: beta_measurement, term: 'builtin:local_path_length', role_id: beta, required: true, config: {sensing_id: beta_probe, range_scale_m: 100}}
world_reward_terms:
  - {selection_id: mission, term: mission_reward, required: true, weight: 1}
world_cost_terms:
  - {selection_id: mission, term: mission_cost}
world_termination_terms:
  - {selection_id: mission, term: mission_done, required: true}

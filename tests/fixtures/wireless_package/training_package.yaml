algorithm: wireless_rule
algorithm_config:
  motion: [0.05, 0.0, 0.0, 0.0]
  power_w: 1.0
  channel_id: 7
  world_power_scales: [1.0, 0.25]
model_bindings: {radio: synthetic_radio, sensing: synthetic_sensing}
agent_roles:
  scout:
    entity_kind: aerial_vehicle
    action_interfaces: {motion: body_velocity, radio: power_channel}
    observation_terms:
      - {selection_id: target, term: 'builtin:relative_target', required: true}
  guard:
    entity_kind: aerial_vehicle
    action_interfaces: {motion: body_velocity, radio: power_channel}
    observation_terms:
      - {selection_id: target, term: 'builtin:relative_target', required: true}
world_termination_terms:
  - {selection_id: done, term: upload_done, default_enabled: true}
  - selection_id: episode_limit
    term: builtin:timeout
    config: {episode_max_steps: 500}
